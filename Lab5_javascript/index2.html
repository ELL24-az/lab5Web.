
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Nilai Mahasiswa</title>
</head>
<body>
    <h1>Kalkulator Nilai Mahasiswa</h1>

    <form id="formNilai">
        <label for="tugas">Nilai Tugas (0-100):</label>
        <input type="number" id="tugas" min="0" max="100" required>
        <br><br>

        <label for="uts">Nilai UTS (0-100):</label>
        <input type="number" id="uts" min="0" max="100" required>
        <br><br>

        <label for="uas">Nilai UAS (0-100):</label>
        <input type="number" id="uas" min="0" max="100" required>
        <br><br>

        <button type="submit">Hitung Nilai</button>
    </form>

    <hr>

    <h2>Hasil Perhitungan</h2>
    <p id="nilaiAkhir">Nilai akhir: -</p>
    <p id="predikat">Predikat: -</p>
    <p id="status">Status kelulusan: -</p>

    <!-- Kode asli dari modul tetap dipanggil -->
    <script src="script2.js"></script>

    <!-- Penghubung form dengan fungsi perhitungan -->
    <script>
        document.getElementById("formNilai").addEventListener("submit", function(event) {
            event.preventDefault();

            const tugas = Number(document.getElementById("tugas").value);
            const uts = Number(document.getElementById("uts").value);
            const uas = Number(document.getElementById("uas").value);

            if (
                tugas < 0 || tugas > 100 ||
                uts < 0 || uts > 100 ||
                uas < 0 || uas > 100
            ) {
                alert("Nilai harus berada pada rentang 0-100.");
                return;
            }

            const akhir = hitungNilaiAkhir(tugas, uts, uas);
            const predikat = tentukanPredikat(akhir);
            const status = akhir >= 60 ? "Lulus" : "Belum lulus";

            document.getElementById("nilaiAkhir").textContent =
                "Nilai akhir: " + akhir.toFixed(2);

            document.getElementById("predikat").textContent =
                "Predikat: " + predikat;

            document.getElementById("status").textContent =
                "Status kelulusan: " + status;
        });
    </script>
</body>
</html>
